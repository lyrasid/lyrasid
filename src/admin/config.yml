# Painel visual (Sveltia CMS). Acesse /admin/ no site publicado.
backend:
  name: github
  repo: lyrasid/lyrasid
  branch: main

media_folder: src/midia
public_folder: /midia

# Fotos enviadas pelo painel são reduzidas antes de ir para o repositório (máx. 2048px, WebP).
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: fixas
    label: Sobre mim e redes
    files:
      - name: sobre
        label: Sobre mim (página inicial)
        file: src/index.md
        fields:
          - { name: layout, widget: hidden, default: sobre.njk }
          - { name: title, label: Nome, widget: string }
          - { name: foto, label: Foto, widget: image, required: false }
          - &papel
            name: papel
            label: Papel do fundo
            widget: select
            required: false
            default: quadriculado
            options:
              - { label: Quadriculado, value: quadriculado }
              - { label: Pautado (com margem), value: pautado }
              - { label: Liso (sem linhas), value: liso }
          - &blocos
            name: blocos
            label: Blocos
            label_singular: Bloco
            widget: list
            required: false
            types:
              - name: texto
                label: Texto
                widget: object
                fields:
                  - { name: texto, label: Texto, widget: markdown, hint: "Grife um trecho com ==assim==. Para trocar a cor: ==verde: assim== ou ==vermelho: assim==." }
                  - &ao_lado { name: ao_lado, label: Ao lado do bloco anterior, widget: boolean, default: false, required: false, hint: "Até 3 blocos lado a lado. No celular ficam um embaixo do outro." }
              - name: imagem
                label: Imagem
                widget: object
                summary: "{{fields.titulo}}"
                fields:
                  - { name: imagem, label: Imagem, widget: image }
                  - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false }
                  - &titulo_midia { name: titulo, label: Título, widget: string, required: false }
                  - &ano { name: ano, label: Ano ou data, widget: string, required: false }
                  - &descricao { name: descricao, label: Descrição, widget: text, required: false }
                  - &lado { name: lado, label: Legenda do lado, widget: select, required: false, default: direita, options: [{ label: Direita, value: direita }, { label: Esquerda, value: esquerda }] }
                  - &largura { name: largura, label: Largura (%), widget: number, value_type: int, min: 20, max: 100, required: false, hint: "Vazio = largura total. No celular é sempre 100%." }
                  - *ao_lado
              - name: video
                label: Vídeo do YouTube
                widget: object
                summary: "{{fields.titulo}}"
                fields:
                  - { name: youtube, label: Link do YouTube, widget: string }
                  - *titulo_midia
                  - *ano
                  - *descricao
                  - *lado
                  - *largura
                  - *ao_lado
              - name: receita
                label: Ficha de receita
                widget: object
                fields:
                  - { name: rendimento, label: Rendimento, widget: string, required: false }
                  - { name: tempo, label: Tempo de preparo, widget: string, required: false }
                  - { name: ingredientes, label: Ingredientes (um por linha), widget: list, required: false, hint: "Aparecem no modo cozinha para riscar com um toque." }
                  - *ao_lado
              - name: planta
                label: Ficha de planta
                widget: object
                fields:
                  - { name: nome_cientifico, label: Nome científico, widget: string, required: false }
                  - { name: luz, label: Luz, widget: string, required: false }
                  - { name: rega, label: Rega, widget: string, required: false }
                  - *ao_lado
          - &adesivos
            name: adesivos
            label: Adesivos
            widget: list
            required: false
            summary: "{{fields.descricao}}"
            fields:
              - { name: imagem, label: Imagem (PNG sem fundo), widget: image }
              - { name: descricao, label: Descrição (acessibilidade), widget: string, required: false }
              - { name: link, label: Ao clicar, abre o texto, widget: relation, collection: textos, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
              - name: segredo
                label: Segredo
                widget: select
                required: false
                options:
                  - { label: Nenhum, value: "" }
                  - { label: Gato que mia com 5 cliques, value: miar }
                  - { label: Cadeado da área restrita, value: cadeado }
                hint: "O cadeado ignora o campo acima e leva para a área restrita."
              - { name: x, label: Posição horizontal (%), widget: number, value_type: int, min: 0, max: 100, default: 80, hint: "0 = borda esquerda do conteúdo, 100 = borda direita." }
              - { name: y, label: Distância do topo (px), widget: number, value_type: int, min: 0, default: 40 }
              - { name: largura, label: Largura (px), widget: number, value_type: int, min: 40, max: 600, default: 140, hint: "No celular aparece com 60% do tamanho." }
              - { name: rotacao, label: Rotação (graus), widget: number, value_type: int, min: -45, max: 45, default: 0 }
              - { name: oculto, label: Ocultar adesivo, widget: boolean, default: false, required: false, hint: "Some do site sem apagar: é só desligar isto para ele voltar." }
      - name: redes
        label: Redes sociais
        file: src/_data/site.json
        fields:
          - { name: nome, label: Nome do site, widget: string }
          - { name: instagram, label: Instagram (link), widget: string, required: false }
          - { name: linkedin, label: LinkedIn (link), widget: string, required: false }
          - { name: email, label: E-mail, widget: string, required: false }
      - name: secreto
        label: Área restrita (easter egg)
        file: src/_data/secreto.json
        fields:
          - name: video
            label: Vídeo do susto
            widget: file
            required: false
            hint: "Toca sozinho, com som, assim que a senha certa é digitada. Envie um arquivo .mp4 ou .webm curto."
          - { name: titulo, label: Título da sala, widget: string, required: false }
          - { name: conteudo, label: O que aparece depois da senha, widget: markdown, required: false }

  - name: paginas
    label: Páginas do menu
    folder: src/paginas
    create: true
    delete: true
    extension: md
    format: frontmatter
    sortable_fields: [ordem, title]
    fields:
      - { name: title, label: Título, widget: string, hint: "O endereço da página é criado a partir do primeiro título e não muda depois." }
      - &ordem { name: ordem, label: Ordem, widget: number, value_type: int, required: false, hint: "Números menores aparecem primeiro." }
      - name: tipo
        label: Tipo de página
        widget: select
        required: false
        options:
          - { label: "Caderno (subtítulos que abrem)", value: "" }
          - { label: "Galeria (capas que abrem em página própria)", value: galeria }
          - { label: "Estante (livros, filmes, séries e jogos)", value: estante }
          - { label: "Pastas (abrem em janela de computador antigo)", value: pastas }
        hint: "A estante usa a lista própria dela; os outros tipos usam os textos ligados a esta página."
      - *papel
      - { name: intro, label: Texto de abertura, widget: markdown, required: false }
      - { name: oculto, label: Ocultar página, widget: boolean, default: false, required: false }
      - *adesivos

  - name: textos
    label: Textos (subtítulos e coleções)
    folder: src/conteudo
    create: true
    delete: true
    extension: md
    format: frontmatter
    sortable_fields: [ordem, title]
    view_groups:
      - { label: Página, field: pagina }
    fields:
      - { name: title, label: Título, widget: string }
      - { name: pagina, label: Página, widget: relation, collection: paginas, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - *ordem
      - { name: oculto, label: Ocultar texto, widget: boolean, default: false, required: false }
      - name: capa
        label: Capa (só em páginas de galeria)
        widget: image
        required: false
        hint: "Vazio = usa a primeira imagem dos blocos."
      - { name: ano, label: Ano, widget: string, required: false, hint: "Alimenta o filtro de ano da página. Aceita intervalo: 2023–2026." }
      - name: comida
        label: Tipo de comida (só em Receitas)
        widget: select
        required: false
        options: [massas, carnes, peixes, saladas, sopas, pães, bolos, doces, geleias, bebidas, molhos, salgados]
        hint: "Alimenta o filtro da página de receitas. Peça para acrescentar tipos à lista."
      - name: planta
        label: Tipo de planta (só em Plantas)
        widget: select
        required: false
        options: [ervas, temperos, frutíferas, árvores, suculentas, cactos, flores, hortaliças, trepadeiras, folhagens]
        hint: "Alimenta o filtro da página de plantas. Peça para acrescentar tipos à lista."
      - { name: viva, label: Planta viva (só em Plantas), widget: boolean, default: true, required: false, hint: "Desligado = foi para o céu das plantas." }
      - { name: local, label: Local, widget: string, required: false }
      - { name: resumo, label: Resumo (aparece no topo da coleção), widget: text, required: false }
      - name: links
        label: Links externos
        widget: list
        required: false
        fields:
          - { name: texto, label: Texto do link, widget: string }
          - { name: url, label: Endereço, widget: string }
      - *blocos

  - name: estante
    label: Estante (o que li, assisti e joguei)
    folder: src/estante
    create: true
    delete: true
    extension: md
    format: frontmatter
    sortable_fields: [data, title, nota]
    view_groups:
      - { label: Tipo, field: tipo }
    summary: "{{title}} — {{tipo}}"
    fields:
      - { name: title, label: Título, widget: string }
      - name: tipo
        label: Tipo
        widget: select
        default: livro
        options:
          - { label: Livro, value: livro }
          - { label: Filme, value: filme }
          - { label: Série, value: serie }
          - { label: Jogo, value: jogo }
      - { name: autor, label: Autoria (autor, diretor, estúdio), widget: string, required: false }
      - { name: ano, label: Ano da obra, widget: string, required: false }
      - { name: nota, label: Nota (0 a 5), widget: number, value_type: int, min: 0, max: 5, required: false }
      - { name: inicio, label: Quando comecei, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Livro, série e jogo levam tempo: com esta data o item entra em todos os meses do período." }
      - { name: data, label: Quando terminei, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: favorito, label: Favorito, widget: boolean, default: false, required: false }
      - { name: capa, label: Capa, widget: image, required: false }
      - { name: comentario, label: Comentário, widget: markdown, required: false }
      - { name: link, label: Link (onde ver ou comprar), widget: string, required: false }
      - { name: oculto, label: Ocultar da estante, widget: boolean, default: false, required: false }
